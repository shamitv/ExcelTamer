[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ExcelTamer"
version = "0.2.1"
description = "A Model Context Protocol server for safe Microsoft Excel automation"
readme = "README.md"
authors = [
  { name = "Shamit" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "xlwings~=0.36.10",
    "pandas~=3.0.5",
    "mcp~=1.28.1",
]
requires-python = ">=3.11"

[project.urls]
"Homepage" = "https://github.com/shamitv/ExcelTamer"
"Bug Tracker" = "https://github.com/shamitv/ExcelTamer/issues"
"Documentation" = "https://github.com/shamitv/ExcelTamer/blob/main/docs/mcp_server.md"
"Repository" = "https://github.com/shamitv/ExcelTamer"

[project.scripts]
exceltamer-mcp = "ExcelTamer.mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ExcelTamer*"]
exclude = ["test*"]

[tool.setuptools.package-data]
"ExcelTamer.mcp" = ["prompts/*.md"]
